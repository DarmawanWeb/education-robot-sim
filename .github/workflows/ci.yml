name: CI

# This app builds inside the education-robot workspace, which holds the shared packages and the
# lockfile. CI checks out the workspace, puts the commit under test at apps/sim, and checks it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Biome, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the education-robot workspace
        uses: actions/checkout@v5
        with:
          repository: DarmawanWeb/education-robot
          submodules: recursive
      - name: Check out the commit under test
        uses: actions/checkout@v5
        with:
          path: under-test
          fetch-depth: 0
      - run: rm -rf apps/sim && mv under-test apps/sim
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The workspace lockfile can lag behind a dependency changed here.
      - run: pnpm install --no-frozen-lockfile
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        working-directory: apps/sim
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: pnpm biome ci apps/sim
      - run: pnpm turbo run typecheck test build --filter=@taksu/sim
